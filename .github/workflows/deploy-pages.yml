name: Deploy Boycott PE Brands to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/boycott-pe-brands-site-0x4kxu
    paths:
      - 'boycott-pe-brands/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boycott-pe-brands
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boycott-pe-brands/package-lock.json

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Repo is served at user.github.io/test-repo/, so assets need the subpath.
          PAGES_BASE_PATH: /test-repo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to the workspace root, not the job working-directory.
          path: boycott-pe-brands/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
